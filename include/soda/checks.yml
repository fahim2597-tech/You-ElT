checks for core.yt_api:

  - missing_count(video_id) = 0

  - duplicate_count(video_id) = 0

  - failed rows:
      name: likes_count_greater_than_views
      fail condition: likes_count > video_views
      warn: when > 0

  - failed rows:
      name: comments_count_greater_than_views
      fail condition: comments_count > video_views
      warn: when > 0
